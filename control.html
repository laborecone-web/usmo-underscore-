<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>USMO Match Control</title>
<style>body{margin:0;background:#0c0f13;color:#fff;font-family:Arial,sans-serif}.w{max-width:760px;margin:40px auto;padding:20px}.card{background:#161b22;border:1px solid #2b323c;border-radius:20px;padding:22px}.score{text-align:center;font-size:48px;font-weight:1000;margin:18px}.time{text-align:center;font-size:32px;font-weight:900;margin-bottom:20px}.g{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}button{min-height:58px;border:0;border-radius:13px;font-size:17px;font-weight:900;cursor:pointer;background:#fff;color:#111}.goal{background:#eaff45}.dark{background:#2a313b;color:#fff}.full{grid-column:1/-1}@media(max-width:500px){.w{margin:10px auto;padding:10px}}</style></head><body><div class="w"><div class="card"><h2>USMO × OCS — Match Control</h2><div id="time" class="time">00:00</div><div class="score"><span id="h">0</span> – <span id="a">0</span></div><div class="g">
<button id="timer" class="full">▶ START TIMER</button><button id="gh" class="goal">⚽ GOAL USMO</button><button id="ga" class="goal">⚽ GOAL OCS</button><button id="hm">USMO +1</button><button id="am">OCS +1</button><button id="hp" class="dark">USMO −1</button><button id="ap" class="dark">OCS −1</button><button id="reset" class="dark full">↻ RESET MATCH</button></div></div></div>
<script>
const KEY='usmo_obs_state_v1';let s;try{s=JSON.parse(localStorage.getItem(KEY))}catch(e){}if(!s)s={h:0,a:0,sec:0,running:false,goal:0,side:'USMO'};let t=null;
function save(){localStorage.setItem(KEY,JSON.stringify(s));draw()}function draw(){h.textContent=s.h;a.textContent=s.a;time.textContent=String(Math.floor(s.sec/60)).padStart(2,'0')+':'+String(s.sec%60).padStart(2,'0');timer.textContent=s.running?'⏸ PAUSE TIMER':'▶ START TIMER'}
function tick(){if(t)clearInterval(t);if(s.running)t=setInterval(()=>{s.sec++;save()},1000)}
timer.onclick=()=>{s.running=!s.running;save();tick()};gh.onclick=()=>{s.h++;s.side='USMO';s.goal=Date.now();save()};ga.onclick=()=>{s.a++;s.side='OCS';s.goal=Date.now();save()};hm.onclick=()=>{s.h++;save()};am.onclick=()=>{s.a++;save()};hp.onclick=()=>{s.h=Math.max(0,s.h-1);save()};ap.onclick=()=>{s.a=Math.max(0,s.a-1);save()};reset.onclick=()=>{s={h:0,a:0,sec:0,running:false,goal:0,side:'USMO'};save();tick()};draw();tick();
</script></body></html>
